name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # for uploading Trivy SARIF results

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Go vulnerability check
        continue-on-error: true # stdlib vulns require a Go patch release to fix
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  commit-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Legacy noreply addresses (<login>@users.noreply.github.com, no numeric id) attribute
      # commits to whichever GitHub account owns <login>; placeholder domains are never valid.
      - name: Reject misattributed commit identities
        run: |
          bad=$(git log --format='%h %ae %ce' | awk '{
            for (i = 2; i <= 3; i++)
              if ($i ~ /@example\.(com|org|net)$/ || $i ~ /^[^+]+@users\.noreply\.github\.com$/) { print; break }
          }')
          if [ -n "$bad" ]; then
            echo "::error::Commits with invalid author/committer email found:"
            echo "$bad"
            exit 1
          fi

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint Helm chart
        run: helm lint ./charts/ghcp-sdk-oai-wrapper/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ghcp-sdk-oai-wrapper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          set -euo pipefail
          docker run --rm ghcp-sdk-oai-wrapper:ci --version
          # The native Copilot CLI must run on the distroless glibc base.
          docker run --rm --entrypoint /usr/local/bin/copilot ghcp-sdk-oai-wrapper:ci --version
          docker run -d --name smoke -e GITHUB_TOKEN=ci-smoke-invalid ghcp-sdk-oai-wrapper:ci
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if docker exec smoke /server --healthcheck; then
              echo "healthy"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::container exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "::error::container did not become healthy within 60s"
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcp-sdk-oai-wrapper:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # SARIF output otherwise includes every severity regardless of `severity`.
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
